name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore release keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.TIMETABLE_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/timetable-release.keystore"
          echo "TIMETABLE_KEYSTORE_PASS=${{ secrets.TIMETABLE_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          echo "TIMETABLE_KEY_ALIAS=${{ secrets.TIMETABLE_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify signature (keystore vs apk)
        run: |
          echo "== release keystore file =="
          ls -la "$HOME/.android/timetable-release.keystore"
          echo "== release keystore cert fingerprint =="
          keytool -list -v -keystore "$HOME/.android/timetable-release.keystore" -storepass "$TIMETABLE_KEYSTORE_PASS" -alias "$TIMETABLE_KEY_ALIAS" 2>&1 | grep -iE "SHA256:" | head -1
          echo "== release apk cert fingerprint =="
          python3 - <<'PYEOF'
          import struct, hashlib
          data = open("app/build/outputs/apk/release/app-release.apk","rb").read()
          eocd = data.rfind(b"\x50\x4b\x05\x06")
          cd_off = struct.unpack_from("<I", data, eocd+16)[0]
          found = data.rfind(b"APK Sig Block 42", 0, cd_off)
          blk_end = found
          blk_start = blk_end - struct.unpack_from("<Q", data, blk_end-8)[0]
          block = data[blk_start:blk_end]
          pos = 8; cert = None
          while pos < len(block)-24:
              pid = struct.unpack_from("<I", block, pos)[0]
              plen = struct.unpack_from("<I", block, pos+4)[0]
              pval = block[pos+8:pos+8+plen]
              if pid in (0x7109871a, 0xf05368c0):
                  def take(buf, off):
                      n = struct.unpack_from("<I", buf, off)[0]
                      return buf[off+4:off+4+n], off+4+n
                  def take_seq(buf, off):
                      n = struct.unpack_from("<I", buf, off)[0]
                      items=[]; p=off+4; end=off+4+n
                      while p<end:
                          it,p=take(buf,p); items.append(it)
                      return items, off+4+n
                  sd, off = take(pval, 0)
                  dg, p = take_seq(sd, 0)
                  sg, p = take_seq(sd, p)
                  certs, p = take_seq(sd, p)
                  if certs:
                      cert = certs[0]; break
              pos += 8 + plen
          if cert:
              fp = hashlib.sha256(cert).hexdigest().upper()
              print("APK cert SHA256:", ":".join(fp[i:i+2] for i in range(0,len(fp),2)))
          else:
              print("APK cert not found")
          PYEOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: 课表 App v1.0.0 (build #${{ github.run_number }})
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          body: |
            自动构建的课表 App APK（软件开发方向）。
            - Debug 版与 Release 版均已签名，可直接安装
            - 功能：上传课表图片 OCR 识别、专业选择、手动校正、按周自动切换

      # Gitee 同步由本地脚本完成（scripts/sync-gitee.ps1），GitHub runner 跨境上传 Gitee 大文件极慢
      # 构建完成后在本地运行：powershell -ExecutionPolicy Bypass -File scripts/sync-gitee.ps1
