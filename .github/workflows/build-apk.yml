name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: '语义化版本号，如 1.4.4；留空则用 v1.0.0-<构建序号>'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore release keystore
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.TIMETABLE_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/timetable-release.keystore"
          echo "TIMETABLE_KEYSTORE_PASS=${{ secrets.TIMETABLE_KEYSTORE_PASS }}" >> "$GITHUB_ENV"
          echo "TIMETABLE_KEY_ALIAS=${{ secrets.TIMETABLE_KEY_ALIAS }}" >> "$GITHUB_ENV"

      - name: Set version env
        run: |
          echo "TIMETABLE_VERSION_NAME=${{ github.event.inputs.version || '1.4.4' }}" >> "$GITHUB_ENV"
          echo "TIMETABLE_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify signature (keystore vs apk)
        run: |
          echo "== release keystore file =="
          ls -la "$HOME/.android/timetable-release.keystore"
          echo "== release keystore cert fingerprint =="
          keytool -list -v -keystore "$HOME/.android/timetable-release.keystore" -storepass "$TIMETABLE_KEYSTORE_PASS" -alias "$TIMETABLE_KEY_ALIAS" 2>&1 | grep -iE "SHA256:" | head -1
          echo "== release apk cert fingerprint (apksigner) =="
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$APKSIGNER" ]; then APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | tail -1); fi
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; else "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时填了 version（如 1.4.4）→ tag 为 v1.4.4；否则用 v1.0.0-<构建序号>
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || format('v1.0.0-{0}', github.run_number) }}
          name: 课表 App ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || format('v1.0.0 (build {0})', github.run_number) }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          body: |
            自动构建的课表 App APK（软件开发方向）。
            - Debug 版与 Release 版均已签名，可直接安装
            - 功能：上传课表图片 OCR 识别、专业选择、手动校正、按周自动切换、拖拽调课/删除

      # Gitee 同步由本地脚本完成（scripts/sync-gitee.ps1），GitHub runner 跨境上传 Gitee 大文件极慢
      # 构建完成后在本地运行：powershell -ExecutionPolicy Bypass -File scripts/sync-gitee.ps1
