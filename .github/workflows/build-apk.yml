name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timetable-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: 课表 App v1.0.0 (build #${{ github.run_number }})
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          body: |
            自动构建的课表 App APK（软件开发方向）。
            - Debug 版与 Release 版均已签名，可直接安装
            - 功能：上传课表图片 OCR 识别、专业选择、手动校正、按周自动切换

      - name: Sync APK to Gitee Release
        if: always()
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -x
          TAG="v1.0.0-${{ github.run_number }}"
          REPO="Carl_Long/software-timetable-app"
          # 已存在同 tag 的 release 则复用，否则创建（均带超时）
          REL_JSON=$(curl -s --max-time 60 "https://gitee.com/api/v5/repos/$REPO/releases/tags/$TAG?access_token=$GITEE_TOKEN")
          REL_ID=$(echo "$REL_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -z "$REL_ID" ]; then
            REL_JSON=$(curl -s --max-time 60 -X POST "https://gitee.com/api/v5/repos/$REPO/releases?access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=timetable-app $TAG" \
              --data-urlencode "target_commitish=master" \
              --data-urlencode "body=auto built apk (GitHub Actions run ${{ github.run_number }})")
            REL_ID=$(echo "$REL_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          fi
          echo "Gitee release id: $REL_ID"
          if [ -z "$REL_ID" ]; then
            echo "WARNING: failed to get/create Gitee release, skip APK upload"; exit 0
          fi
          curl -s --max-time 300 -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN&name=app-release.apk" -F "file=@app/build/outputs/apk/release/app-release.apk" -o /tmp/gitee-rel.json -w "release upload http=%{http_code}\n" || echo "release upload failed"
          curl -s --max-time 300 -X POST "https://gitee.com/api/v5/repos/$REPO/releases/$REL_ID/attach_files?access_token=$GITEE_TOKEN&name=app-debug.apk" -F "file=@app/build/outputs/apk/debug/app-debug.apk" -o /tmp/gitee-debug.json -w "debug upload http=%{http_code}\n" || echo "debug upload failed"
          echo "SYNC DONE"
