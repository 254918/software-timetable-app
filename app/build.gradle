plugins {
    id 'com.android.application' version '7.2.1'
    id 'org.jetbrains.kotlin.android' version '1.6.21'
}

// versionCode 必须单调递增，否则部分手机安装器会把覆盖安装当成冲突提示、要求卸载重装（卸载会清空课表数据！）
// GitHub Actions 用构建序号自动递增；本地默认 1
def _versionCode = (System.getenv('TIMETABLE_VERSION_CODE') ?: '1') as int
// 语义化版本名：GitHub Actions 手动触发时可从 TIMETABLE_VERSION_NAME 传入（如 1.4.4），本地默认 1.4.4
def _versionName = System.getenv('TIMETABLE_VERSION_NAME') ?: "1.4.4"

android {
    namespace 'com.example.timetable'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.timetable"
        minSdk 24
        targetSdk 33
        versionCode _versionCode
        versionName _versionName
    }

    signingConfigs {
        // 固定发布签名：所有版本使用同一证书，保证覆盖安装不冲突
        // 密钥文件从 ~/.android/timetable-release.keystore 读取（GitHub Actions 从 Secret 解码，本地手动放置）
        release {
            def ks = file("${System.getProperty('user.home')}/.android/timetable-release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('TIMETABLE_KEYSTORE_PASS') ?: 'timetable'
                keyAlias System.getenv('TIMETABLE_KEY_ALIAS') ?: 'timetable'
                keyPassword System.getenv('TIMETABLE_KEYSTORE_PASS') ?: 'timetable'
            } else {
                // 密钥缺失时直接报错，绝不静默回退 debug 签名（否则覆盖安装又会冲突）
                throw new GradleException("Release keystore missing at ${ks.absolutePath} - set TIMETABLE_KEYSTORE_B64 secret")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // 方便测试
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    // 离线中文 OCR（Google ML Kit）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    // 云端 OCR（百度）网络请求与协程
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4'
}
