plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.timetable'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.timetable"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // 固定发布签名：所有版本使用同一证书，保证覆盖安装不冲突
        // 密钥文件优先读 ~/.android/timetable-release.keystore（GitHub Actions 从 Secret 解码，本地从 ~/.android 读取）
        release {
            def ks = file("${System.getProperty('user.home')}/.android/timetable-release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('TIMETABLE_KEYSTORE_PASS') ?: 'timetable'
                keyAlias System.getenv('TIMETABLE_KEY_ALIAS') ?: 'timetable'
                keyPassword System.getenv('TIMETABLE_KEYSTORE_PASS') ?: 'timetable'
            } else {
                // 兜底：debug 签名（无固定密钥的本地环境）
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // 方便测试
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    // 离线中文 OCR（Google ML Kit）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    // 云端 OCR（百度）网络请求与协程
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4'
}
